<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <defs>
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff334b" />
      <stop offset="100%" stop-color="#b3001b" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#ff2a44" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Icon: Modern stylized Barbell / Hexagon Flame -->
  <g transform="translate(6, 6)">
    <!-- Outer shield / polygon -->
    <path d="M24 2 L44 14 L44 34 L24 46 L4 34 L4 14 Z" fill="#14151b" stroke="url(#redGlow)" stroke-width="2.5" />
    <!-- Barbell weights inside -->
    <rect x="10" y="20" width="5" height="8" rx="1.5" fill="#ff2a44" />
    <rect x="17" y="17" width="5" height="14" rx="1.5" fill="url(#redGlow)" />
    <!-- Bar -->
    <line x1="14" y1="24" x2="34" y2="24" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    <!-- Right weights -->
    <rect x="26" y="17" width="5" height="14" rx="1.5" fill="url(#redGlow)" />
    <rect x="33" y="20" width="5" height="8" rx="1.5" fill="#ff2a44" />
    <!-- Dynamic lightning / accent dot -->
    <circle cx="24" cy="11" r="2.5" fill="#ff334b" filter="url(#shadow)" />
  </g>
  
  <!-- Text Brand -->
  <text x="64" y="34" font-family="'Montserrat', 'Oswald', 'Segoe UI', sans-serif" font-weight="900" font-size="26" fill="#ffffff" letter-spacing="1.5">
    FIT<tspan fill="#ff2a44">ZONE</tspan>
  </text>
  <text x="66" y="47" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="600" font-size="8.5" fill="#a1a1aa" letter-spacing="3.8">
    MANAGEMENT SYSTEM
  </text>
</svg>
